<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Andrea - Bad Bunny</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player">
    <h1>🎵 Andrea - Bad Bunny ft. Buscabulla</h1>
    <img src="andrea-cover.jpg" alt="Album Art" class="album-art" />
    <audio id="audio" src="andrea.mp3"></audio>

    <input type="range" id="seekBar" value="0" step="1" />
    <div class="time-display">
      <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="playBtn">▶️ Play</button>
      <button id="pauseBtn">⏸️ Pause</button>
      <button id="stopBtn">⏹️ Stop</button>
    </div>

    <div class="volume-control">
      <label for="volume">🔊 Volume:</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const seekBar = document.getElementById('seekBar');
    const volume = document.getElementById('volume');
    const currentTimeDisplay = document.getElementById('currentTime');
    const durationDisplay = document.getElementById('duration');

    playBtn.addEventListener('click', () => audio.play());
    pauseBtn.addEventListener('click', () => audio.pause());
    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
    });

    volume.addEventListener('input', () => {
      audio.volume = volume.value;
    });

    audio.addEventListener('timeupdate', () => {
      seekBar.value = audio.currentTime;
      seekBar.max = audio.duration || 0;
      currentTimeDisplay.textContent = formatTime(audio.currentTime);
      durationDisplay.textContent = formatTime(audio.duration);
    });

    seekBar.addEventListener('input', () => {
      audio.currentTime = seekBar.value;
    });

    function formatTime(time) {
      if (isNaN(time)) return "0:00";
      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60).toString().padStart(2, "0");
      return `${minutes}:${seconds}`;
    }
  </script>
</body>
</html>
